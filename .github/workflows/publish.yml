name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
        default: patch
        required: true
      dry_run:
        description: Validate and pack without publishing
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04

    environment: publish

    permissions:
      contents: write
      id-token: write

    steps:
      # workflow_dispatch lets the caller pick any ref, and a later step pushes
      # to main. Refuse to run from anywhere else so a feature branch cannot be
      # released and fast-forwarded onto main by accident.
      - name: Verify running from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Releases must run from main, got ${{ github.ref }}"
            exit 1
          fi

      # The "Required Checks" ruleset on main blocks direct pushes, and grants
      # bypass to the Automated Publisher GitHub App rather than to
      # GITHUB_TOKEN. Pushing the release commit therefore has to be
      # authenticated as the App.
      - name: Authenticate with GitHub App
        id: app-token
        uses: peter-murray/workflow-application-token-action@v3
        with:
          application_id: ${{ secrets.GH_APP_ID }}
          application_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # The App token has to be the one checkout persists into the git remote,
      # otherwise the push below goes out as GITHUB_TOKEN and the ruleset
      # rejects it.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Verify changelog has entries
        run: bun .github/scripts/changelog.js check

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      # A failed build must block the release rather than publish a tarball
      # whose `dist` is stale or missing. The plugin is loaded by the consumer's
      # Node during `vite.config` evaluation, so it ships compiled JS plus
      # declarations — `.ts` from node_modules is not loadable there.
      - name: Build package
        run: bun run build

      # Writes to the runner's working tree only. Nothing is committed, pushed, or
      # published until the registry pre-flight below passes.
      #
      # `--no-git-tag-version` is load-bearing: `bun pm version` otherwise
      # commits and tags on its own, which would race the explicit commit and
      # tag below and leave a stray `v`-prefixed tag next to our unprefixed one.
      # `bun pm version` prints the new version as `v1.2.3`, hence the strip.
      - name: Compute next version
        id: version
        run: |
          raw=$(bun pm version ${{ inputs.bump }} --no-git-tag-version)
          version=${raw#v}

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed version: $version"

      - name: Registry pre-flight
        run: |
          bun .github/scripts/check-registry.js \
            "${{ steps.version.outputs.version }}" \
            vite-react-file-router

      # Must run before the changelog is promoted, since promoting empties the
      # Unreleased section that these notes come from.
      - name: Extract release notes
        run: bun .github/scripts/changelog.js extract > /tmp/release-notes.md

      - name: Update changelog
        run: |
          bun .github/scripts/changelog.js promote \
            "${{ steps.version.outputs.version }}" \
            "$(date -u +%Y-%m-%d)"

      - name: Commit version bump
        run: |
          git config user.name 'Automated Publisher'
          git config user.email 'automated-publisher[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md
          git commit -m "Release ${{ steps.version.outputs.version }}"

      - name: Pack package
        if: ${{ inputs.dry_run }}
        run: bunx npm@11 publish --dry-run

      # Deliberately ahead of the publish step. Pushing is reversible and npm
      # publishing is not, so a rejected push must not be able to strand npm
      # ahead of the repository.
      - name: Push commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.version }}"

      # Authenticates via OIDC through npm Trusted Publishing, which also
      # attaches a provenance attestation. `id-token: write` above is what makes
      # that token available.
      - name: Publish package
        if: ${{ !inputs.dry_run }}
        run: bunx npm@11 publish

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run complete."
          echo "Nothing was published, pushed, tagged, or released."
          echo "Version that would have shipped: ${{ steps.version.outputs.version }}"
          echo ""
          echo "Release notes that would have been used:"
          echo ""
          cat /tmp/release-notes.md
